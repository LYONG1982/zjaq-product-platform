  /api/v1/admin/uploads/{uploadId}/content:
    put:
      operationId: putUploadBytes
      summary: 后台流式写入暂存对象；身份、uploadId归属、长度和状态校验；不公开原件。
      tags:
      - admin
      security:
      - AdminBearer: []
      x-required-role: CONTENT_MANAGER, ADMIN
      parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 上传字节已收妥，尚须complete技术检查。
          content:
            application/json:
              schema:
                $ref: ./response.schema.json#/$defs/UploadResultResponse
        '401':
          description: 后台未登录
        '403':
          description: 非后台或不匹配上传任务
        '409':
          description: 该上传已完成或对象不可覆盖
        '413':
          description: 超出当前限额
