  /api/v1/catalog/products/{productId}/materials/{materialId}/preview/content:
    get:
      operationId: streamCurrentPreview
      summary: releaseId/versionId/part；每次核对当前绑定；支持Range；原件不可通过purpose参数取得。
      tags:
        - catalog
      security: []
      x-required-role: public
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: materialId
          in: path
          required: true
          schema:
            type: string
        - name: releaseId
          in: query
          required: true
          schema:
            type: string
        - name: versionId
          in: query
          required: true
          schema:
            type: string
        - name: part
          in: query
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: '当前允许的二进制预览内容，Cache-Control: no-store；不返回永久存储路径。'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: 经过状态检查的部分内容；正确返回Content-Range。
        '416':
          description: 无效或超出范围的Range。
        '400':
          description: 规范错误，详见补充说明；只在对应条件下返回。
          content:
            application/json:
