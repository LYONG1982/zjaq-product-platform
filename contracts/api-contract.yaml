  /api/v1/admin/media-session:
    post:
      operationId: createAdminMediaSession
      summary: 使用已有 Bearer 建立 5 分钟 HttpOnly 只读媒体 Cookie；仅同站后台资源 GET 使用，禁止在 URL 传递令牌。
      tags: [ admin ]
      security: [ { bearerAuth: [] } ]
      x-required-role: admin
      responses:
        '204':
          description: 已设置路径受限的 SameSite Strict Cookie；生产为 Secure。无响应正文。
        '401':
          description: 身份失效或未提供 Bearer。
          content:
            application/json:
              schema: { $ref: './domain.schema.json#/$defs/Error' }
