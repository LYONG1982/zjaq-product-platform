# zjaq-product-platform：1Panel OpenResty 三子域名反代模板
#
# 放置位置（宿主）：
#   /opt/1panel/apps/openresty/openresty/conf/conf.d/zjaq-product-platform.conf
# 实际路径以 docker inspect 1Panel-openresty-* 的挂载为准。
#
# 替换点（未替换会导致 nginx -t 失败，禁止直接上线）：
#   <PORTAL_DOMAIN> / <ADMIN_DOMAIN> / <WX_DOMAIN>  三个真实域名
#   <CERT_DIR>  OpenResty 容器内证书目录，例如 /www/sites/zjaq-product-platform/ssl
#
# 前置条件：
#   1. deploy/compose.yml 的 web 已改为 127.0.0.1:8080:443
#   2. 证书目录内存在 fullchain.pem 与 privkey.pem，且 SAN 覆盖上述三个域名
#   3. 本文件只新增，不修改现有站点配置；上线只执行 nginx -t 与 -s reload
#
# 域名口径：portal 为 PC 门户；admin 为管理后台（浏览器同源 /api/v1）；
# wx 同时承载 H5 静态页与 /api 反代。公网 8443 实际映射到内网 443，
# 因此 wx 的 443 段必须整段转发到 web 容器，不能返回 404。

server {
    listen 80;
    server_name <PORTAL_DOMAIN> <ADMIN_DOMAIN> <WX_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <PORTAL_DOMAIN>;

    ssl_certificate     <CERT_DIR>/fullchain.pem;
    ssl_certificate_key <CERT_DIR>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ZJAQ_SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 32m;

    # /api/* 归 Next.js 路由处理器所有，原样转发给 portal，不做 API 反代
    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端传入的 XFF，防止伪造；web 侧会再追加一跳
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    server_name <ADMIN_DOMAIN>;

    ssl_certificate     <CERT_DIR>/fullchain.pem;
    ssl_certificate_key <CERT_DIR>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ZJAQ_SSL:10m;
    ssl_session_timeout 10m;

    # 后台单文件上传上限 500 MiB，代理层留余量，与 web 内 512m 一致
    client_max_body_size 512m;
    client_body_timeout 120s;

    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;
        # 大文件上传不做请求缓冲
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    server_name <WX_DOMAIN>;

    ssl_certificate     <CERT_DIR>/fullchain.pem;
    ssl_certificate_key <CERT_DIR>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ZJAQ_SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 32m;

    # 小程序接口：关闭缓冲、放宽超时
    location /api/ {
        proxy_pass https://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # H5 静态页与该域名的 /api/v1 都由 web 容器按 Host 分流，这里整段透传
    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
