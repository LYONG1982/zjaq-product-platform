# zjaq-product-platform：8443 过渡入口（公网 80/443 未备案被拦截期间使用）
#
# 放置位置（宿主）：/home/1panel/www/conf.d/zjaq-h5-8443.conf
# 容器内：conf.d/zjaq-h5-8443.conf（由 openresty.conf 的 conf.d/*.conf 包含）
#
# 说明：
#   - 与 443 段共用同一张证书 *.product.zhongjianquan.com，路径为容器内绝对路径。
#   - 只新增本文件，不修改现有 80/443 段，也不触碰 default/wx_product.conf 与 /hrxjs1LgTG.txt。
#   - 上线只做 openresty -t 与 -s reload；回滚 = 删除本文件 + reload。
#   - Host 必须用 $host（不含端口），否则 api 的 ALLOWED_HOSTS 精确匹配会 403。
#   - 8443 面前置的是 web 容器 127.0.0.1:8080（容器内 443），不新增端口映射。

server {
    listen 8443 ssl http2;
    server_name portal.product.zhongjianquan.com;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/zhongjianquan.crt;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/zhongjianquan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ZJAQ_8443_SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 32m;

    # /api/* 归 Next.js 路由处理器所有，原样转发给 portal
    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端传入的 XFF，防止伪造；web 侧会再追加一跳
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8443 ssl http2;
    server_name admin.product.zhongjianquan.com;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/zhongjianquan.crt;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/zhongjianquan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ZJAQ_8443_SSL:10m;
    ssl_session_timeout 10m;

    # 与 443 段一致：500 MiB 单文件上限 + 代理层留余量
    client_max_body_size 512m;
    client_body_timeout 120s;

    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;
        # 大文件上传不做请求缓冲
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 8443 ssl http2;
    server_name wx.product.zhongjianquan.com;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/zhongjianquan.crt;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/zhongjianquan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ZJAQ_8443_SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 32m;

    # H5 静态页与该域名的 /api/v1 都由 web 容器按 Host 分流，这里整段透传
    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
